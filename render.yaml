# Готовий опис сервісу для Render. Досить під'єднати репозиторій —
# решту Render візьме звідси.
services:
  - type: web
    name: balloon-tapper
    runtime: node
    plan: free
    # --include=dev обов'язкове: Render ставить NODE_ENV=production, а з ним
    # `npm ci` пропускає devDependencies — і збірка падає на `vite: not found`.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node server/index.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
